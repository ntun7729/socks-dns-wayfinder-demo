services:
  - type: web
    name: s5dns-render-test
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /usr/local/bin/render-supervisor
    region: singapore
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: S5DNS_PASSWORD
        sync: false
      - key: CLOUDFLARED_TUNNEL_TOKEN
        sync: false
      - key: S5DNS_DNS_UPSTREAM
        value: 1.1.1.1:53
